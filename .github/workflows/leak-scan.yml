name: Leak scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan added lines
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
        run: python .github/scripts/leak_scan.py "origin/${{ github.base_ref }}"
